<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Distribuciones MC — Pedidos</title>
<style>
  /* ══ RESET & BASE ══ */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #f0f2f5; }

  /* ══ HEADER ══ */
  .header { background: #1a4a2e; padding: 16px 18px 14px; position: sticky; top: 0; z-index: 50; }
  .header h1 { color: #fff; font-size: 20px; font-weight: 700; }
  .header p  { color: rgba(255,255,255,.65); font-size: 13px; margin-top: 2px; }

  /* ══ PASOS ══ */
  .step { display: none; padding: 16px 14px 100px; }
  .step.active { display: block; }

  /* ══ BUSCADOR ══ */
  .big-input {
    width: 100%; padding: 15px 16px; font-size: 18px;
    border: 2px solid #d0d5dd; border-radius: 14px;
    background: #fff; color: #1a4a2e; outline: none;
    margin-bottom: 12px;
  }
  .big-input:focus { border-color: #1a4a2e; }

  /* ══ LISTA CLIENTES ══ */
  .cli-item {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 2px solid #e4e7ec;
    border-radius: 14px; padding: 14px 14px;
    margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
    -webkit-user-select: none; user-select: none;
  }
  .cli-item:active { background: #eaf3de; border-color: #1a4a2e; }
  .cli-num {
    background: #1a4a2e; color: #fff;
    border-radius: 8px; padding: 5px 9px;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .cli-name { font-size: 17px; font-weight: 600; color: #1a4a2e; display: block; line-height: 1.25; }
  .cli-pob  { font-size: 13px; color: #667085; display: block; margin-top: 1px; }
  .btn-puntual {
    width: 100%; padding: 15px; margin-top: 6px;
    border: 2px dashed #aaa; border-radius: 14px;
    background: transparent; color: #667085; font-size: 16px; cursor: pointer;
  }
  .btn-puntual:active { background: #f5f5f5; }

  /* ══ CLIENTE ACTIVO ══ */
  .cli-activo {
    background: #1a4a2e; color: #fff; border-radius: 12px;
    padding: 13px 15px; margin-bottom: 14px;
    font-size: 16px; font-weight: 600;
  }
  .cli-activo small { display: block; font-size: 12px; opacity: .7; margin-top: 2px; font-weight: 400; }

  /* ══ SECCIÓN TÍTULO ══ */
  .sec { font-size: 12px; font-weight: 700; color: #667085; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }

  /* ══ BOTÓN ATRÁS ══ */
  .btn-back {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; color: #1a4a2e;
    font-size: 15px; font-weight: 600; cursor: pointer;
    padding: 0; margin-bottom: 14px;
  }

  /* ══ GRID FAMILIAS ══ */
  .fam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fam-btn {
    padding: 16px 10px; border-radius: 14px; border: 2px solid transparent;
    font-size: 14px; font-weight: 700; text-align: center; cursor: pointer;
    line-height: 1.3; transition: transform .1s;
  }
  .fam-btn:active { transform: scale(.97); }

  /* ══ TARJETA PRODUCTO ══ */
  .prod-card { border-radius: 14px; margin-bottom: 10px; border: 2px solid transparent; overflow: hidden; }
  .prod-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; }
  .prod-cod  { font-size: 11px; opacity: .65; display: block; margin-bottom: 2px; }
  .prod-nom  { font-size: 16px; font-weight: 700; line-height: 1.25; flex: 1; }
  .prod-eur  { font-size: 17px; font-weight: 800; flex-shrink: 0; }
  .prod-foot { background: rgba(0,0,0,.07); padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .upill {
    padding: 6px 12px; border-radius: 20px; border: 1.5px solid rgba(0,0,0,.2);
    background: rgba(255,255,255,.55); font-size: 13px; font-weight: 600;
    cursor: pointer; color: #333;
  }
  .upill.on { background: #1a4a2e; color: #fff; border-color: #1a4a2e; }
  .qty-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .qbtn {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: #1a4a2e; color: #fff; font-size: 24px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .qnum { width: 34px; text-align: center; font-size: 20px; font-weight: 800; color: #1a4a2e; }

  /* ══ CARRITO STICKY ══ */
  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #1a4a2e; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 -4px 20px rgba(0,0,0,.2);
  }
  .cart-bar .ci { color: rgba(255,255,255,.75); font-size: 13px; }
  .cart-bar .ct { color: #fff; font-size: 22px; font-weight: 800; }
  .cart-bar .go {
    background: #fff; color: #1a4a2e; border: none;
    border-radius: 10px; padding: 11px 18px;
    font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .cart-bar .go:disabled { opacity: .4; }

  /* ══ RESUMEN ══ */
  .res-row {
    background: #fff; border-radius: 12px;
    padding: 13px 14px; margin-bottom: 8px;
    border-left: 5px solid #ccc;
    display: flex; align-items: center; gap: 10px;
  }
  .res-name { font-size: 15px; font-weight: 700; color: #1a4a2e; }
  .res-det  { font-size: 13px; color: #667085; margin-top: 2px; }
  .res-sub  { font-size: 17px; font-weight: 800; flex-shrink: 0; }
  .total-box {
    background: #1a4a2e; color: #fff; border-radius: 12px;
    padding: 14px; text-align: right;
    font-size: 24px; font-weight: 800; margin-bottom: 10px;
  }
  .btn-confirm {
    width: 100%; padding: 18px; background: #1a4a2e; color: #fff;
    border: none; border-radius: 14px; font-size: 20px; font-weight: 800; cursor: pointer;
  }
  .btn-confirm:disabled { opacity: .5; }

  /* ══ MODAL PUNTUAL ══ */
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 200;
  }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 18px; padding: 22px; width: 88%; max-width: 340px; }
  .modal h3 { font-size: 19px; font-weight: 700; color: #1a4a2e; margin-bottom: 14px; }
  .modal input {
    width: 100%; padding: 13px; font-size: 16px;
    border: 2px solid #d0d5dd; border-radius: 10px; margin-bottom: 10px; outline: none;
  }
  .modal input:focus { border-color: #1a4a2e; }
  .modal-btns { display: flex; gap: 8px; }
  .m-cancel { flex: 1; padding: 13px; border: 2px solid #d0d5dd; border-radius: 10px; background: #fff; font-size: 16px; cursor: pointer; }
  .m-ok { flex: 1; padding: 13px; background: #1a4a2e; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }

  /* ══ TOAST ══ */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #1a4a2e; color: #fff; padding: 12px 22px; border-radius: 30px;
    font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .3s; z-index: 300;
    white-space: nowrap; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ══ LOADING ══ */
  .loading { text-align: center; padding: 40px; color: #667085; font-size: 16px; }
</style>
</head>

<div class="header">
  <h1>📦 Distribuciones MC</h1>
  <p id="header-sub">Selecciona el cliente</p>
</div>

<!-- PASO 1: CLIENTE -->
<div id="p1" class="step active">
  <input class="big-input" type="text" id="sc" placeholder="🔍 Buscar cliente..." oninput="filtrarCli()">
  <div id="clist"><div class="loading">Cargando clientes…</div></div>
  <button class="btn-puntual" onclick="showModal()">➕ Cliente puntual (no está en la lista)</button>
</div>

<!-- PASO 2: FAMILIA -->
<div id="p2" class="step">
  <button class="btn-back" onclick="ir(1)">← Cambiar cliente</button>
  <div class="cli-activo" id="cli-activo">
    <span id="ca-name">—</span>
    <small id="ca-det"></small>
  </div>
  <p class="sec">¿Qué familia de productos?</p>
  <div class="fam-grid" id="fam-grid"></div>
</div>

<!-- PASO 3: PRODUCTOS -->
<div id="p3" class="step">
  <button class="btn-back" onclick="ir(2)">← Otras familias</button>
  <input class="big-input" style="font-size:16px;padding:12px 14px" type="text" id="sp" placeholder="🔍 Buscar producto..." oninput="renderProds()">
  <div id="plist"></div>
  <div class="cart-bar">
    <div>
      <div class="ci" id="cc">0 productos</div>
      <div class="ct" id="ct">0,00 €</div>
    </div>
    <button class="go" id="bgo" onclick="ir(4)" disabled>Ver pedido →</button>
  </div>
</div>

<!-- PASO 4: RESUMEN -->
<div id="p4" class="step">
  <button class="btn-back" onclick="ir(3)">← Añadir más productos</button>
  <p class="sec">Resumen del pedido</p>
  <div id="res-list"></div>
  <div class="total-box" id="res-total">0,00 €</div>
  <button class="btn-confirm" id="btn-conf" onclick="enviarPedido()">✅ Confirmar y enviar pedido</button>
</div>

<!-- MODAL PUNTUAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>➕ Cliente puntual</h3>
    <input type="text" id="mp-n" placeholder="Nombre del cliente">
    <input type="text" id="mp-t" placeholder="Teléfono (opcional)">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal()">Cancelar</button>
      <button class="m-ok" onclick="addPuntual()">Añadir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ══ ESTADO ══
let CLI = null, carrito = {}, famSel = null, puntuales = [];

// ══ NAVEGACIÓN ══
function ir(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('p' + n).classList.add('active');
  window.scrollTo(0, 0);
  if (n === 1) { filtrarCli(); document.getElementById('header-sub').textContent = 'Selecciona el cliente'; }
  if (n === 2) initFams();
  if (n === 3) renderProds();
  if (n === 4) renderResumen();
}
window.ir = ir;

// ══ CLIENTES ══
// Guardamos índice para recuperar datos al tocar
let _cliCache = [];

function filtrarCli() {
  const q = document.getElementById('sc').value.toLowerCase().trim();
  const todos = [...puntuales.map(p => [p.id, p.nombre, p.tel || 'Puntual']), ...CLIENTES];
  const res = q ? todos.filter(c => c[1].toLowerCase().includes(q) || String(c[0]).includes(q)) : todos.slice(0, 50);
  _cliCache = res.slice(0, 50);
  document.getElementById('clist').innerHTML = _cliCache.map((c, i) => `
    <div class="cli-item" data-idx="${i}">
      <span class="cli-num">${c[0]}</span>
      <div>
        <span class="cli-name">${c[1]}</span>
        <span class="cli-pob">${c[2] || ''}</span>
      </div>
    </div>`).join('');
}
window.filtrarCli = filtrarCli;

// Delegación de eventos — se registra tras DOMContentLoaded
function _initClistEvents() {
  const el = document.getElementById('clist');
  if (!el) return;
  function handler(e) {
    const item = e.target.closest('.cli-item');
    if (!item) return;
    if (e.type === 'touchend') e.preventDefault();
    const idx = parseInt(item.dataset.idx);
    const c = _cliCache[idx];
    if (c) selCli(c[0], c[1], c[2] || '');
  }
  el.addEventListener('click', handler);
  el.addEventListener('touchend', handler);
}

function selCli(id, nombre, pob) {
  CLI = { id, nombre, pob };
  carrito = {};
  famSel = null;
  document.getElementById('ca-name').textContent = nombre;
  document.getElementById('ca-det').textContent = `Nº ${id}${pob ? ' · ' + pob : ''}`;
  document.getElementById('header-sub').textContent = nombre;
  ir(2);
}
window.selCli = selCli;

// ══ FAMILIAS ══
let _famsCache = [];

function initFams() {
  _famsCache = [...new Set(PRODS.map(p => p[0]))];
  document.getElementById('fam-grid').innerHTML = _famsCache.map((f, i) => {
    const c = fc(f);
    return `<button class="fam-btn" data-fam="${i}" style="background:${c.bg};border-color:${c.bo};color:${c.tx}">${f}</button>`;
  }).join('');
}

function selFam(f) { famSel = f; ir(3); }
window.selFam = selFam;

function _initFamEvents() {
  const el = document.getElementById('fam-grid');
  if (!el) return;
  function handler(e) {
    const btn = e.target.closest('.fam-btn');
    if (!btn) return;
    if (e.type === 'touchend') e.preventDefault();
    const f = _famsCache[parseInt(btn.dataset.fam)];
    if (f) selFam(f);
  }
  el.addEventListener('click', handler);
  el.addEventListener('touchend', handler);
}

// ══ PRODUCTOS ══
function getUnits(p) {
  const u = ['1 ud'];
  if (p[4]) u.push('caja ' + p[4]);
  if (p[5]) u.push('caja ' + p[5]);
  return u;
}

function renderProds() {
  const q = document.getElementById('sp').value.toLowerCase();
  let prods = famSel ? PRODS.filter(p => p[0] === famSel) : PRODS;
  if (q) prods = prods.filter(p => p[2].toLowerCase().includes(q) || p[1].toLowerCase().includes(q));
  const c = fc(famSel || '');
  document.getElementById('plist').innerHTML = prods.map(p => {
    const units = getUnits(p);
    const item = carrito[p[1]];
    const selU = item ? item.unit : units[0];
    const qty = item ? item.qty : 0;
    const upills = units.map(u =>
      `<span class="upill${u === selU ? ' on' : ''}" data-cod="${p[1]}" data-unit="${u}">${u}</span>`
    ).join('');
    return `<div class="prod-card" style="background:${c.bg};border-color:${c.bo}">
      <div class="prod-head">
        <div style="flex:1">
          <span class="prod-cod" style="color:${c.bo}">${p[1]}</span>
          <span class="prod-nom" style="color:${c.tx}">${p[2]}</span>
        </div>
        <span class="prod-eur" style="color:${c.bo}">${p[3].toFixed(2)}€</span>
      </div>
      <div class="prod-foot">
        <div style="display:flex;gap:6px;flex-wrap:wrap;flex:1">${upills}</div>
        <div class="qty-wrap">
          <button class="qbtn" data-cod="${p[1]}" data-delta="-1" style="background:${c.bo}">−</button>
          <span class="qnum" id="bq-${p[1]}">${qty}</span>
          <button class="qbtn" data-cod="${p[1]}" data-delta="1" style="background:${c.bo}">+</button>
        </div>
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:50px;color:#aaa;font-size:16px">Sin resultados</div>`;
}
window.renderProds = renderProds;

function setUnit(cod, unit) {
  if (carrito[cod]) carrito[cod].unit = unit;
  else carrito[cod] = { qty: 0, unit };
  renderProds();
}
window.setUnit = setUnit;

function chQty(cod, d) {
  const p = PRODS.find(x => x[1] === cod); if (!p) return;
  if (!carrito[cod]) carrito[cod] = { qty: 0, unit: getUnits(p)[0] };
  carrito[cod].qty = Math.max(0, carrito[cod].qty + d);
  if (carrito[cod].qty === 0) delete carrito[cod];
  const el = document.getElementById('bq-' + cod);
  if (el) el.textContent = carrito[cod] ? carrito[cod].qty : 0;
  updCart();
}
window.chQty = chQty;

// Delegación global para productos (botones + / − y píldoras de unidad)
function _prodDelegate(e) {
  // Botón cantidad
  const qbtn = e.target.closest('.qbtn');
  if (qbtn) {
    e.preventDefault();
    chQty(qbtn.dataset.cod, parseInt(qbtn.dataset.delta));
    return;
  }
  // Píldora unidad
  const upill = e.target.closest('.upill');
  if (upill) {
    e.preventDefault();
    setUnit(upill.dataset.cod, upill.dataset.unit);
    return;
  }
  // Botón atrás grande
  const back = e.target.closest('.btn-back');
  if (back) { e.preventDefault(); return; }
}
function _initPlistEvents() {
  const el = document.getElementById('plist');
  if (!el) return;
  el.addEventListener('click', _prodDelegate);
  el.addEventListener('touchend', _prodDelegate);
}

function updCart() {
  const items = Object.entries(carrito);
  let tot = 0;
  items.forEach(([cod, { qty, unit }]) => {
    const p = PRODS.find(x => x[1] === cod); if (!p) return;
    const m = unit === '1 ud' ? 1 : parseInt(unit.split(' ')[1]) || 1;
    tot += p[3] * qty * m;
  });
  document.getElementById('cc').textContent = items.length + ' prod.';
  document.getElementById('ct').textContent = tot.toFixed(2) + ' €';
  document.getElementById('bgo').disabled = items.length === 0;
}

// ══ RESUMEN ══
function renderResumen() {
  let tot = 0;
  const items = Object.entries(carrito);
  document.getElementById('res-list').innerHTML = items.map(([cod, { qty, unit }]) => {
    const p = PRODS.find(x => x[1] === cod); if (!p) return '';
    const m = unit === '1 ud' ? 1 : parseInt(unit.split(' ')[1]) || 1;
    const sub = p[3] * qty * m; tot += sub;
    const c = fc(p[0]);
    return `<div class="res-row" style="border-left-color:${c.bo}">
      <div style="flex:1">
        <div class="res-name">${p[2]}</div>
        <div class="res-det">${qty} × ${unit} &nbsp;·&nbsp; ${p[3].toFixed(2)} €/ud</div>
      </div>
      <div class="res-sub" style="color:${c.bo}">${sub.toFixed(2)} €</div>
    </div>`;
  }).join('');
  document.getElementById('res-total').textContent = tot.toFixed(2) + ' €';
}

// ══ ENVIAR PEDIDO ══
async function enviarPedido() {
  const btn = document.getElementById('btn-conf');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';
  const items = Object.entries(carrito);
  let tot = 0;
  const lineas = items.map(([cod, { qty, unit }]) => {
    const p = PRODS.find(x => x[1] === cod); if (!p) return null;
    const m = unit === '1 ud' ? 1 : parseInt(unit.split(' ')[1]) || 1;
    const sub = p[3] * qty * m; tot += sub;
    return { cod, nombre: p[2], fam: p[0], qty, unit, precioBase: p[3], precioFinal: p[3], mult: m, subtotal: sub };
  }).filter(Boolean);

  const pedido = {
    cliente: CLI.nombre,
    numCli: CLI.id,
    pob: CLI.pob || '',
    fecha: new Date().toLocaleDateString('es-ES'),
    hora: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
    ts: Date.now(),
    lineas,
    total: tot,
    estado: 'pendiente'
  };

  try {
    if (window._fbPush) {
      await window._fbPush(pedido);
      toast('✅ Pedido enviado correctamente');
    } else {
      toast('⚠️ Configurar Firebase para enviar');
    }
  } catch (e) {
    toast('❌ Error al enviar: ' + e.message);
    btn.disabled = false;
    btn.textContent = '✅ Confirmar y enviar pedido';
    return;
  }

  carrito = {}; CLI = null;
  btn.disabled = false;
  btn.textContent = '✅ Confirmar y enviar pedido';
  setTimeout(() => ir(1), 1500);
}
window.enviarPedido = enviarPedido;

// ══ MODAL PUNTUAL ══
function showModal() { document.getElementById('overlay').classList.add('show'); }
function closeModal() { document.getElementById('overlay').classList.remove('show'); }
function addPuntual() {
  const n = document.getElementById('mp-n').value.trim();
  const t = document.getElementById('mp-t').value.trim();
  if (!n) { toast('Escribe el nombre del cliente'); return; }
  puntuales.push({ id: 'P' + Date.now().toString().slice(-3), nombre: n, tel: t });
  closeModal();
  document.getElementById('mp-n').value = '';
  document.getElementById('mp-t').value = '';
  filtrarCli();
}
window.showModal = showModal;
window.closeModal = closeModal;
window.addPuntual = addPuntual;

// ══ TOAST ══
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// INIT — esperamos a que el DOM esté completamente listo
document.addEventListener('DOMContentLoaded', function() {
  _initClistEvents();
  _initFamEvents();
  _initPlistEvents();
  filtrarCli();
});
</script>
